[package]
name = "Cordon"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
chrono = "0.4"
fd-lock = "4.0.4"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
seccompiler = { version = "0.4.0", features = ["json"] }
tempfile = "3.10"
syscallz = "0.16"
serde_json = "1.0"
libc = "0.2"
sha2 = "0.10.9"
